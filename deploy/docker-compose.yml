version: '3.8'

services:
  rag-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: enterprise-rag-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_ENABLED=true
      - SEMANTIC_CACHE_SIMILARITY_THRESHOLD=0.92
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=enterprise_knowledge_base
      - RRF_K=60
      - FUSED_TOP_N=50
      - RERANKER_TOP_K=5
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - rag-network

  redis:
    image: redis/redis-stack:latest
    container_name: enterprise-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--save 60 1000 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: enterprise-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  prometheus:
    image: prom/prometheus:latest
    container_name: enterprise-rag-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
