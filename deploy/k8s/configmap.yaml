apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-rag-config
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-hybrid-rag
    app.kubernetes.io/component: gateway
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  REDIS_URL: "redis://redis-service.default.svc.cluster.local:6379/0"
  REDIS_CACHE_ENABLED: "true"
  SEMANTIC_CACHE_SIMILARITY_THRESHOLD: "0.92"
  SEMANTIC_CACHE_TTL_SECONDS: "86400"
  QDRANT_URL: "http://qdrant-service.default.svc.cluster.local:6333"
  QDRANT_COLLECTION_NAME: "enterprise_knowledge_base"
  EMBEDDING_MODEL: "text-embedding-3-large"
  EMBEDDING_DIMENSION: "3072"
  RRF_K: "60"
  FUSED_TOP_N: "50"
  RERANKER_MODEL: "BAAI/bge-reranker-large"
  RERANKER_TOP_K: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-rag-secrets
  namespace: default
type: Opaque
stringData:
  OPENAI_API_KEY: "change-me-in-production"
  AZURE_OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
