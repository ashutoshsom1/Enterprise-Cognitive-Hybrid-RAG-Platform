[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-hybrid-rag"
version = "1.0.0"
description = "High-throughput Enterprise Cognitive Hybrid RAG Platform combining Dense Vector & BM25 Sparse Search with Cross-Encoder reranking, Redis Semantic Caching, and sub-500ms P99 latency."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Enterprise AI Engineering Team", email = "ai-eng@enterprise-rag.com" }
]
keywords = [
    "rag", "hybrid-search", "dense-vector", "bm25", "rrf", "cross-encoder",
    "qdrant", "redis", "fastapi", "ragas", "semantic-cache"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
]
eval = [
    "ragas>=0.1.9",
    "datasets>=2.19.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
